[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-graph"
version = "0.1.0"
description = "Persistent universal and personal concept graphs with reproducible traversal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["SQLAlchemy>=2.0,<3", "alembic>=1.13,<2"]

[project.optional-dependencies]
sparse = ["scipy>=1.13,<2"]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "networkx>=3,<4", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memory_graph = ["methodology.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
