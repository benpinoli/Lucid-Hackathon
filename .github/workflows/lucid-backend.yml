name: LUCID backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pytest -c backend/pytest.ini backend/tests -q
      - run: python -m backend.tools.schemas --check
        env:
          PYTHONPATH: src:.
